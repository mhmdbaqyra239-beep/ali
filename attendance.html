<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تقرير الحضور</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <a href="index.html"><button>⬅️ الرجوع</button></a>
  <h2>تقرير الحضور</h2>
  <table id="report" style="width:100%; border-collapse:collapse;">
    <tr style="background:#ddd;"><th>التاريخ</th><th>الطالب</th><th>الحالة</th></tr>
  </table>
</div>

<script>
let attendance = JSON.parse(localStorage.getItem('attendance')||'{}');
for(let date in attendance){
  for(let name in attendance[date]){
    document.getElementById('report').innerHTML += `
    <tr><td>${date}</td><td>${name}</td><td>${attendance[date][name]}</td></tr>`;
  }
}
</script>
</body>
</html>
